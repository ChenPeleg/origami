<!doctype html>
<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Origami mockup</title>
<style>
:root{--bg:#F6F7FB;--ink:#1F2A44;--brand:#1F4FD8;--accent:#C2410C;--water:#2F6FBF;--muted:#4B5568;--line:#D5DAE5;--paper:#fff;--paper-shade:#E9EDF5}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:Heebo,Assistant,"Segoe UI",Arial,sans-serif;font-size:16px;line-height:1.5;position:relative;min-height:100vh}
a{color:inherit;text-decoration:none}
nav.top{background:#fff;border-bottom:1px solid var(--line);padding:0 16px}
.bar1{display:flex;align-items:center;gap:8px;min-height:60px;max-width:1100px;margin:0 auto}
.logo{display:flex;align-items:center;gap:8px;font-weight:700;font-size:18px;min-height:44px;color:var(--brand)}
.links{display:flex;gap:4px;margin-inline-start:16px}
.links a{min-height:44px;min-width:44px;padding:0 14px;display:flex;align-items:center;gap:6px;border-radius:8px;font-weight:600}
.links a.cur{background:#E6ECFD;color:var(--brand);box-shadow:inset 0 -3px 0 var(--brand)}
.sp{flex:1}
.sw{display:flex;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.sw span{min-width:44px;min-height:44px;display:flex;align-items:center;justify-content:center;font-weight:700}
.sw .on{background:var(--brand);color:#fff}
.burger{display:none;min-width:44px;min-height:44px;border:1px solid var(--line);border-radius:8px;background:#fff;font-size:22px;align-items:center;justify-content:center}
.mm{display:none}
main{max-width:1100px;margin:0 auto;padding:20px 16px 40px}
h1{font-size:26px;margin:8px 0 16px}
h2{font-size:20px;margin:0 0 8px}
.card{background:var(--paper);border:1px solid var(--line);border-radius:14px;padding:14px;display:block}
.grid{display:grid;gap:16px;grid-template-columns:1fr}
@media(min-width:900px){.grid{grid-template-columns:1fr 1fr}}
.cover{background:var(--paper-shade);border-radius:10px;width:100%;aspect-ratio:4/3;display:block}
.cover svg,.fold svg{width:100%;height:100%;display:block}
.meta{display:flex;flex-wrap:wrap;gap:6px 14px;color:var(--muted);font-size:15px;margin:6px 0}
.badge{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--ink);border-radius:999px;padding:2px 10px;font-size:14px;font-weight:600;background:#fff}
.btn{min-height:48px;padding:0 18px;border-radius:10px;border:2px solid var(--brand);background:#fff;color:var(--brand);font:inherit;font-weight:700;display:inline-flex;align-items:center;justify-content:center;gap:8px;cursor:pointer}
.btn.p{background:var(--brand);color:#fff}
.btn.d{background:#B42318;border-color:#B42318;color:#fff}
.row{display:flex;flex-wrap:wrap;gap:10px;margin-top:12px}.row .btn{flex:1}
.bar{height:10px;background:var(--paper-shade);border-radius:6px;overflow:hidden}.bar i{display:block;height:100%;background:var(--brand)}
.mir{display:inline-block}[dir=rtl] .mir{transform:scaleX(-1)}
.search{display:flex;align-items:center;gap:10px;background:#fff;border:2px solid var(--brand);border-radius:10px;min-height:52px;padding:0 14px;margin-bottom:16px;outline:3px solid #C7D5FA}
.search .q{flex:1;font-size:17px}.search .ph{color:var(--muted)}
.cnt{color:var(--muted);margin:0 0 12px}
table{width:100%;border-collapse:separate;border-spacing:0;background:#fff;border:1px solid var(--line);border-radius:14px;overflow:hidden}
th,td{text-align:start;padding:0 16px;min-height:56px;height:56px;border-bottom:1px solid var(--line)}
tr:last-child td{border-bottom:0}
th{background:var(--paper-shade);font-weight:700}
th .h{display:inline-flex;align-items:center;gap:6px;min-height:44px}
th[aria-sort] .h{color:var(--brand)}
.focus{outline:3px solid var(--accent);outline-offset:2px}
.cards{display:none}.tbl{display:block}
.sortc{display:none}
.empty{text-align:center;padding:36px 16px}.empty .big{font-size:48px}
.fold{background:#fff;border:1px solid var(--line);border-radius:14px;aspect-ratio:4/3;width:100%}
.stepgrid{display:grid;gap:16px;grid-template-columns:1fr}
@media(min-width:900px){.stepgrid{grid-template-columns:1.2fr 1fr}}
select{min-height:48px;font:inherit;border:2px solid var(--line);border-radius:10px;padding:0 10px;background:#fff;color:var(--ink)}
.scrim{position:fixed;inset:0;background:rgba(31,42,68,.55)}
.dlg{position:absolute;top:200px;left:50%;transform:translateX(-50%);width:min(440px,calc(100% - 32px));background:#fff;border-radius:16px;padding:22px;box-shadow:0 10px 40px rgba(0,0,0,.35)}
.map{display:grid;gap:18px;grid-template-columns:repeat(3,1fr)}
.tile{background:#fff;border:2px solid var(--line);border-radius:12px;overflow:hidden}
.tile h3{margin:0;padding:8px 12px;background:var(--brand);color:#fff;font-size:15px}
.mini{display:flex;align-items:center;gap:6px;padding:6px 10px;border-bottom:1px solid var(--line);font-size:12px;background:#F8F9FC}
.mini b{color:var(--brand)}.mini .sp{flex:1}.mini .l{border:1px solid var(--line);border-radius:5px;padding:0 6px}
.tb{padding:12px;font-size:14px;min-height:110px}
.sk{background:var(--paper-shade);border-radius:6px;height:14px;margin:6px 0}
.flow{margin-top:20px;background:#fff;border:1px solid var(--line);border-radius:12px;padding:14px 18px}
.flow li{margin:4px 0}
@media(max-width:700px){
.links{display:none}.burger{display:flex}.sp{display:none}.bar1{justify-content:space-between}
.mm.open{display:flex;flex-direction:column;border-top:1px solid var(--line);padding:8px 0}
.mm a{min-height:48px;display:flex;align-items:center;gap:8px;padding:0 8px;font-weight:600;border-radius:8px}
.mm a.cur{background:#E6ECFD;color:var(--brand)}
.tbl{display:none}.cards{display:grid;gap:12px}.sortc{display:flex;align-items:center;gap:10px;margin-bottom:12px}.sortc select{flex:1;min-width:0}
.map{grid-template-columns:1fr}h1{font-size:22px}
}
html.m body{width:390px;margin-left:0;margin-right:auto}
html.m .links{display:none}html.m .burger{display:flex}html.m .sp{display:none}html.m .bar1{justify-content:space-between}
html.m .mm.open{display:flex;flex-direction:column;border-top:1px solid var(--line);padding:8px 0}
html.m .mm a{min-height:48px;display:flex;align-items:center;gap:8px;padding:0 8px;font-weight:600;border-radius:8px}
html.m .mm a.cur{background:#E6ECFD;color:var(--brand)}
html.m .tbl{display:none}html.m .cards{display:grid;gap:12px}html.m .sortc{display:flex;align-items:center;gap:10px;margin-bottom:12px}html.m .sortc select{flex:1;min-width:0}
html.m .map{grid-template-columns:1fr}html.m h1{font-size:22px}
</style></head><body>
