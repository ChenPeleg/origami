<!doctype html>
<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Origami Guides mockup</title>
<style>
:root{--bg:#F6F7FB;--ink:#1F2A44;--brand:#1F4FD8;--accent:#C2410C;--water:#2F6FBF;--muted:#4B5568;--line:#D5DAE5;--paper:#fff;--paper-shade:#E9EDF5}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:Heebo,Assistant,"Segoe UI",Arial,sans-serif;font-size:16px;line-height:1.5}
header{display:flex;justify-content:space-between;align-items:center;padding:12px 16px;background:#fff;border-block-end:1px solid var(--line)}
.logo{font-weight:700;font-size:18px}
.sw{display:flex;border:2px solid var(--brand);border-radius:12px;overflow:hidden}
.sw span{min-width:44px;height:44px;display:flex;align-items:center;justify-content:center;font-weight:600;color:var(--brand)}
.sw span.on{background:var(--brand);color:#fff}
main{max-width:1100px;margin:0 auto;padding:16px}
h1{font-size:26px;margin:8px 0 16px}
.card{background:#fff;border:1px solid var(--line);border-radius:16px;padding:16px;display:flex;flex-direction:column;gap:10px}
.card svg,.hero svg{width:100%;height:auto;background:var(--paper-shade);border-radius:12px}
.grid{display:grid;gap:16px;grid-template-columns:1fr}
.badge{display:inline-flex;gap:6px;align-items:center;border:1.5px solid var(--ink);border-radius:999px;padding:2px 10px;font-size:14px;font-weight:600;width:fit-content}
.st{color:var(--muted);font-size:14px}
.btn{min-height:48px;padding:0 20px;border-radius:12px;border:2px solid var(--brand);background:#fff;color:var(--brand);font:600 16px inherit;font-family:inherit;display:inline-flex;align-items:center;justify-content:center;gap:8px}
.btn.p{background:var(--brand);color:#fff}
.btn.d{border-color:#B42318;color:#B42318}
.row{display:flex;gap:12px;flex-wrap:wrap}.row .btn{flex:1}
.bar{height:10px;background:var(--line);border-radius:6px;overflow:hidden}.bar i{display:block;height:100%;background:var(--brand)}
.split{display:grid;gap:16px;grid-template-columns:1fr}
.panel{display:flex;flex-direction:column;gap:14px}
.tag{background:#FFF1E8;color:#9A3412;border:1.5px dashed #9A3412;border-radius:8px;padding:2px 10px;width:fit-content;font-weight:600;font-size:14px}
select{min-height:48px;border:2px solid var(--line);border-radius:12px;padding:0 12px;font-size:16px;font-family:inherit;background:#fff;color:var(--ink)}
.center{text-align:center;align-items:center}
.mir{display:inline-block}[dir=rtl] .mir{transform:scaleX(-1)}
#model3d{width:0;height:0;overflow:hidden}
.inst{font-size:20px;font-weight:500}
@media(min-width:900px){.grid{grid-template-columns:1fr 1fr}.split{grid-template-columns:1.1fr 1fr;align-items:start}h1{font-size:32px}}
</style></head><body><div id="app"></div>
<script>
const q=new URLSearchParams(location.search),L=q.get('lang')==='he'?'he':'en',S=q.get('screen')||'catalog';
document.documentElement.lang=L;document.documentElement.dir=L==='he'?'rtl':'ltr';
const T={en:{app:'Origami Guides',cat:'Choose a guide',n:['Paper Boat','Fold in Half','Tulip','Crane'],d:['Beginner','Beginner','Intermediate','Advanced'],st:['Completed','In progress','Not started','Not started'],b:['Restart','Resume','Start','Start'],steps:n=>n+' steps',step:'Step 3 of 8',home:'Back to catalog',diff:'Difficulty',prog:'3 of 8 steps done',resume:'Resume',restart:'Restart',tag:'Valley fold',inst:'Fold the top half down along the dashed line so the edges meet.',leg:'Dashed line = valley fold',jump:'Jump to step',back:'Back',next:'Next',done:'Well done! You finished the Paper Boat.',fin:'Step 8 of 8',clear:'Clear my progress',lang:'Language'},
he:{app:'מדריכי אוריגמי',cat:'בחרו מדריך',n:['סירת נייר','קיפול לשניים','צבעוני','עגור'],d:['מתחילים','מתחילים','בינוני','מתקדם'],st:['הושלם','בתהליך','טרם התחיל','טרם התחיל'],b:['התחלה מחדש','המשך','התחלה','התחלה'],steps:n=>n+' שלבים',step:'שלב 3 מתוך 8',home:'חזרה לקטלוג',diff:'רמת קושי',prog:'3 מתוך 8 שלבים הושלמו',resume:'המשך',restart:'התחלה מחדש',tag:'קיפול עמק',inst:'קפלו את החצי העליון כלפי מטה לאורך הקו המקווקו כך שהקצוות ייפגשו.',leg:'קו מקווקו = קיפול עמק',jump:'מעבר לשלב',back:'הקודם',next:'הבא',done:'כל הכבוד! סיימתם את סירת הנייר.',fin:'שלב 8 מתוך 8',clear:'ניקוי ההתקדמות שלי',lang:'שפה'}}[L];
const stepSvg=`<svg viewBox="0 0 320 240" role="img" aria-label="${T.tag}"><rect x="80" y="40" width="160" height="160" rx="10" fill="#fff" stroke="#1F2A44" stroke-width="3"/><g fill="#C2410C"><circle cx="100" cy="60" r="7"/><circle cx="220" cy="60" r="7"/><circle cx="100" cy="180" r="7"/><circle cx="220" cy="180" r="7"/></g><line x1="70" y1="120" x2="250" y2="120" stroke="#C2410C" stroke-width="4" stroke-dasharray="14 9"/><path d="M160 80 C210 80 220 110 190 126" fill="none" stroke="#1F2A44" stroke-width="4"/><path d="M184 112 L192 128 L174 130Z" fill="#1F2A44"/></svg>`;
const boatSvg=`<svg viewBox="0 0 320 240" role="img" aria-label="${T.n[0]}"><path d="M160 40 L160 150 L80 150Z" fill="#fff" stroke="#1F2A44" stroke-width="3" stroke-linejoin="round"/><path d="M168 70 L168 150 L225 150Z" fill="#E9EDF5" stroke="#1F2A44" stroke-width="3" stroke-linejoin="round"/><path d="M60 160 H260 L228 200 H92Z" fill="#C2410C" stroke="#1F2A44" stroke-width="3" stroke-linejoin="round"/><path d="M30 215 q20-14 40 0 t40 0 t40 0 t40 0 t40 0 t40 0" fill="none" stroke="#2F6FBF" stroke-width="4"/></svg>`;
const hdr=`<header><div class="logo">🦢 ${T.app}</div><div class="sw" role="group" aria-label="${T.lang}"><span class="${L==='he'?'on':''}">עב</span><span class="${L==='en'?'on':''}">EN</span></div></header>`;
const diffBadge=i=>{const lv=[1,1,2,3][i];return `<span class="badge"><span aria-hidden="true">${'●'.repeat(lv)}${'○'.repeat(3-lv)}</span>${T.d[i]}</span>`};
const pb=(t,c)=>`<div class="bar" role="progressbar" aria-label="${t}"><i style="width:${c}%"></i></div>`;
const home=`<div><button class="btn"><span class="mir" aria-hidden="true">←</span> ${T.home}</button></div>`;
let m='';
if(S==='catalog'){m=`<h1>${T.cat}</h1><div class="grid">`+[0,1,2,3].map(i=>`<article class="card">${i===0?boatSvg:stepSvg}<h2 style="margin:0">${T.n[i]}</h2><div class="row" style="gap:8px;align-items:center">${diffBadge(i)}<span class="st">${T.steps([8,6,12,18][i])}</span></div><div class="st">${T.st[i]}</div><button class="btn ${i>0?'p':''}">${T.b[i]}</button></article>`).join('')+`</div>`}
if(S==='overview'){m=`${home}<div class="split" style="margin-top:12px"><div class="hero">${boatSvg}</div><div class="panel"><h1 style="margin:0">${T.n[0]}</h1><div>${diffBadge(0)} <span class="st">· ${T.steps(8)}</span></div><div class="st">${T.prog}</div>${pb(T.prog,37.5)}<div class="row"><button class="btn p">${T.resume}</button><button class="btn">${T.restart}</button></div></div></div>`}
if(S==='step'){m=`${home}<div class="split" style="margin-top:12px"><div class="hero">${stepSvg}<div id="model3d" aria-hidden="true"></div></div><div class="panel"><div class="st" style="font-weight:600;color:var(--ink)">${T.step}</div>${pb(T.step,37.5)}<span class="tag">${T.tag}</span><p class="inst" style="margin:0">${T.inst}</p><div class="st">${T.leg}</div><label class="panel" style="gap:6px">${T.jump}<select><option>${T.step}</option></select></label><div class="row"><button class="btn"><span class="mir" aria-hidden="true">←</span> ${T.back}</button><button class="btn p">${T.next} <span class="mir" aria-hidden="true">→</span></button></div></div></div>`}
if(S==='completed'){m=`<div class="panel center" style="max-width:560px;margin:0 auto"><div style="font-size:48px" aria-hidden="true">🎉</div><div class="hero" style="width:100%">${boatSvg}</div><h1 style="margin:0">${T.done}</h1><div class="st">${T.fin}</div>${pb(T.fin,100)}<div class="row" style="width:100%"><button class="btn p">${T.home}</button><button class="btn">${T.restart}</button></div><div class="row" style="width:100%"><button class="btn"><span class="mir" aria-hidden="true">←</span> ${T.back}</button><button class="btn d">${T.clear}</button></div></div>`}
document.getElementById('app').innerHTML=hdr+`<main>${m}</main>`;
</script></body></html>
